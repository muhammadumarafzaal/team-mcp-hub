[project]
name = "remote-mcpserver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "muhammadumarafzaal", email = "umarafzaal182@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
remote-mcpserver = "remote_mcpserver:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
